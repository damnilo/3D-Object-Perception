# ===============================================
# ROAD OBJECT 3D MAPPING - PIPELINE CONFIGURATION
# ===============================================

paths:
  raw_video: "data/1ffad8eba31588461aa76d8c8fd0be7e.mp4"
  frames_dir: "data/processed/frames"
  colmap_workspace: "data/processed/colmap"
  output_dir: "outputs"

frame_extraction:
  fps: 10
  resize_width: 1280

detection:
  model: "yolov8n-seg.pt"
  confidence: 0.4
  target_classes:
    - "car"
    - "truck"
    - "bus"
    - "motorcycle"
    - "bicycle"
    - "person"
    - "traffic light"
    - "stop sign"

depth:
  model: "depth-anything/Depth-Anything-V2-Small-hf"
  device: "cpu"

slam:
  backend: "lk_vo"
  max_consecutive_failures: 1
  max_change_ratio: 3.0
  max_forward_angle_deg: 45
  # Bottom of a dashcam frame is the ego hood and dashboard. Features there
  # do not move, and they pull the translation estimate off the road.
  ego_mask_y: 0.70

mapping:
  # Repeated views of one object land a few meters apart. This joins them
  # into a single outline instead of drawing the same object several times.
  cluster_eps_meters: 5.0
  cluster_min_samples: 2

visualization:
  point_size: 3
  show_camera_trajectory: true
  show_axes: true
